apiVersion: v1
kind: Secret
metadata:
  name: vahan-agent-secrets
  namespace: vahan-agent
type: Opaque
stringData:
  # --- LLM ---
  ANTHROPIC_API_KEY: ""           # Fill before deploying

  # --- Sandbox ---
  SANDBOX_TYPE: "modal"
  MODAL_TOKEN_ID: ""              # Fill before deploying
  MODAL_TOKEN_SECRET: ""          # Fill before deploying

  # --- GitHub App ---
  GITHUB_APP_ID: ""               # Fill before deploying
  GITHUB_APP_PRIVATE_KEY: ""      # Fill before deploying (PEM format)
  GITHUB_APP_INSTALLATION_ID: ""  # Fill before deploying
  GITHUB_WEBHOOK_SECRET: ""       # Fill before deploying

  # --- Slack ---
  SLACK_SIGNING_SECRET: ""        # Fill before deploying
  SLACK_BOT_TOKEN: ""             # Fill before deploying (xoxb-...)
  SLACK_BOT_USER_ID: ""           # Fill before deploying

  # --- Database (LangGraph state) ---
  LANGGRAPH_STORAGE_URI: ""       # Fill: postgresql://user:pass@host:5432/vahan_agent

  # --- Model ---
  LLM_MODEL_ID: "anthropic:claude-sonnet-4-6"
  LLM_FALLBACK_MODEL_ID: "anthropic:claude-haiku-4-5"
