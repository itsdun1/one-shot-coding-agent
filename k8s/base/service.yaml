apiVersion: v1
kind: Service
metadata:
  name: vahan-agent
  namespace: vahan-agent
  labels:
    app: vahan-agent
spec:
  type: ClusterIP
  selector:
    app: vahan-agent
  ports:
    - name: webhooks
      port: 8000
      targetPort: 8000
    - name: langgraph
      port: 2024
      targetPort: 2024
