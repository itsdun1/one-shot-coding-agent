apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vahan-agent
  namespace: vahan-agent
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - host: agent.vahan.internal  # Change to your actual domain
      http:
        paths:
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: vahan-agent
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vahan-agent
                port:
                  number: 2024
